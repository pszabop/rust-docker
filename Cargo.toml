[package]
name = "hash-correctness"
version = "1.0.0"
authors = ["Paul Szabo <paul@umlss.com>"]
edition = "2018"

[profile.release]
incremental = true

[profile.dev]
incremental = true

[dependencies]
tokio = { version = "1.41.0", features = ["full"] }
async-trait="0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.19"
bytes = "1"
memchr = "2.7.4"
redis = { version = "0.27.2", features = ["tokio-comp"] }
uuid = { version = "^1.11.0", features = ["v4", "v5"]}
arrayvec = "0.7.6"
simhash = "0.2.0"
rand = "^0.8"
xxhash-rust = { version = "^0.8", features = ["xxh32", "xxh3"]}
tlsh = "*"
ffuzzy = "0.3.12"
nilsimsa = { git = "https://github.com/pszabop/nilsimsa.git", branch = "stable-fix" }
plotters = "0.3.7"
bktree = "1.0.1"
parking_lot = "0.12"
flate2 = "1.0"

[dev-dependencies]
